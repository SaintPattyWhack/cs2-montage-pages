<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cs2-montage — TikTok authorisation</title>
<style>
:root{
  --ground:#12110f; --panel:#1a1917; --rule:#2d2b27;
  --ink:#e8e6e2; --dim:#8f8b84; --go:#9ac02c; --bad:#c25550;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:38rem;margin:0 auto;padding:3rem 1.25rem}
h1{font-size:1.2rem;font-weight:600;letter-spacing:.02em;margin:0 0 .4rem}
p{color:var(--dim);margin:.6rem 0}
.code{
  font:15px/1.5 ui-monospace,"JetBrains Mono",Consolas,monospace;
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;
  padding:.9rem 1rem;margin:1.1rem 0 .5rem;word-break:break-all;
  color:var(--ink);user-select:all;
}
button{
  font:inherit;font-size:.9rem;background:var(--go);color:#12110f;
  border:0;border-radius:4px;padding:.5rem 1rem;cursor:pointer;font-weight:600;
}
button:hover{filter:brightness(1.08)}
.err{color:var(--bad)}
.note{font-size:.85rem;border-top:1px solid var(--rule);margin-top:2rem;
  padding-top:1rem}
code{background:var(--panel);padding:.1rem .35rem;border-radius:3px;
  font-family:ui-monospace,Consolas,monospace;font-size:.9em}
</style>
</head>
<body>
<main>
  <h1>TikTok authorisation</h1>
  <p id="lede">Reading the authorisation code…</p>

  <div class="code" id="code" hidden></div>
  <button id="copy" hidden>Copy the code</button>

  <p class="note">
    Paste it into the terminal where <code>cs2 auth --tiktok</code> is waiting.
    The code is <strong>single use and expires within minutes</strong> — if it
    is refused, run the command again for a fresh one rather than reusing this
    page.
  </p>
</main>

<script>
/* Everything happens here in the browser. This page has no server, stores
   nothing, and sends nothing anywhere: it exists only because TikTok refuses
   to redirect to a loopback address, so the code cannot be caught on a local
   port the way the Google flow catches it. */
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get("code");
  var err = q.get("error");
  var lede = document.getElementById("lede");
  var box = document.getElementById("code");
  var copy = document.getElementById("copy");

  if (err) {
    lede.className = "err";
    lede.textContent = "TikTok refused the authorisation: " + err +
      (q.get("error_description") ? " — " + q.get("error_description") : "");
    return;
  }
  if (!code) {
    lede.textContent = "No authorisation code in this URL. Start from " +
      "`cs2 auth --tiktok`, which prints the link to open.";
    return;
  }

  lede.textContent = "Copy this code:";
  box.textContent = code;
  box.hidden = false;
  copy.hidden = false;
  copy.onclick = function () {
    navigator.clipboard.writeText(code).then(function () {
      copy.textContent = "Copied";
      setTimeout(function () { copy.textContent = "Copy the code"; }, 1600);
    }, function () {
      /* Clipboard access can be refused; the box is `user-select:all` so a
         click-and-copy still works, and saying so beats a button that
         silently does nothing. */
      copy.textContent = "Copy failed — select the box above";
    });
  };
})();
</script>
</body>
</html>
